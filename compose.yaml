name: campuscast

x-common-env: &common-env
  NODE_ENV: ${NODE_ENV:-production}
  JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
  DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-false}
  DB_MIGRATIONS_RUN: ${DB_MIGRATIONS_RUN:-true}
  REDIS_URL: redis://redis:6379
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  AUDIT_SERVICE_URL: http://audit-service:3009

services:
  # ─── Infrastructure ───
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: campuscast
      POSTGRES_PASSWORD: campuscast
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campuscast"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      sleep 3 &&
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/campuscast-content &&
      mc anonymous set public local/campuscast-content &&
      echo 'Bucket campuscast-content ready and public'
      "

  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./docker/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
    ports:
      - "1883:1883"
      - "9883:9883"

  # ─── Reverse Proxy ───
  nginx:
    image: nginx:alpine
    volumes:
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
      - "3000:80"
      - "443:443"
    depends_on:
      - api-gateway
      - web-app

  # ─── Observability ───
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3100:3000"

  loki:
    image: grafana/loki:latest
    ports:
      - "3200:3100"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./docker/otel-collector/config.yaml:/etc/otel/config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"

  # ─── Application Services ───
  web-app:
    build:
      context: ../repo-web-app
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_APP_NAME: CampusCast CMS
      NEXT_PUBLIC_API_PREFIX: /api/v1
      NEXT_PUBLIC_WS_SYNC_URL: ws://localhost/ws/sync
      NEXT_PUBLIC_MINIO_PUBLIC_URL: http://localhost:9000
      BACKEND_BASE_URL: http://api-gateway:3000

  api-gateway:
    build:
      context: ..
      dockerfile: repo-api-gateway-bff/Dockerfile
    environment:
      <<: *common-env
      PORT: "3000"
      AUTH_SERVICE_URL: http://auth-iam:3001
      ZONE_SERVICE_URL: http://zone-policy:3002
      DEVICE_SERVICE_URL: http://device-management:3003
      CONTENT_SERVICE_URL: http://content-service:3004
      SCHEDULE_SERVICE_URL: http://schedule-service:3005
      SYNC_SERVICE_URL: http://sync-service:3006
      VALIDATION_SERVICE_URL: http://validation-qa:3007
      AUDIT_SERVICE_URL: http://audit-service:3009
    depends_on:
      - redis

  auth-iam:
    build:
      context: ..
      dockerfile: repo-auth-iam/Dockerfile
    environment:
      <<: *common-env
      PORT: "3001"
      DATABASE_URL: postgresql://campuscast:campuscast@postgres:5432/auth_db
      AUTH_BOOTSTRAP_ROOT_ENABLED: ${AUTH_BOOTSTRAP_ROOT_ENABLED:-false}
      AUTH_BOOTSTRAP_ROOT_EMAIL: ${AUTH_BOOTSTRAP_ROOT_EMAIL:-}
      AUTH_BOOTSTRAP_ROOT_PASSWORD: ${AUTH_BOOTSTRAP_ROOT_PASSWORD:-}
      AUTH_BOOTSTRAP_ROOT_ROLE: ${AUTH_BOOTSTRAP_ROOT_ROLE:-super_admin}
      AUTH_BOOTSTRAP_ROOT_RESET_PASSWORD: ${AUTH_BOOTSTRAP_ROOT_RESET_PASSWORD:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  zone-policy:
    build:
      context: ..
      dockerfile: repo-zone-policy/Dockerfile
    environment:
      <<: *common-env
      PORT: "3002"
      DATABASE_URL: postgresql://campuscast:campuscast@postgres:5432/zone_policy_db
      SYNC_SERVICE_URL: http://sync-service:3006
    depends_on:
      postgres:
        condition: service_healthy

  device-management:
    build:
      context: ..
      dockerfile: repo-device-management/Dockerfile
    environment:
      <<: *common-env
      PORT: "3003"
      DATABASE_URL: postgresql://campuscast:campuscast@postgres:5432/device_db
      INTERNAL_SERVICE_TOKEN: campuscast-internal-dev-token
      ZONE_POLICY_URL: http://zone-policy:3002
    depends_on:
      postgres:
        condition: service_healthy

  content-service:
    build:
      context: ..
      dockerfile: repo-content-service/Dockerfile
    environment:
      <<: *common-env
      PORT: "3004"
      DATABASE_URL: postgresql://campuscast:campuscast@postgres:5432/content_db
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: campuscast-content
      SIGNING_KMS_URL: http://signing-kms:3008
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  schedule-service:
    build:
      context: ..
      dockerfile: repo-schedule-service/Dockerfile
    environment:
      <<: *common-env
      PORT: "3005"
      DATABASE_URL: postgresql://campuscast:campuscast@postgres:5432/schedule_db
      INTERNAL_SERVICE_TOKEN: campuscast-internal-dev-token
      CRDT_COMPACTION_THRESHOLD: "100"
      CRDT_GLOBAL_ENABLED: "true"
      SIGNING_KMS_URL: http://signing-kms:3008
      VALIDATION_QA_URL: http://validation-qa:3007
      SYNC_SERVICE_URL: http://sync-service:3006
      ZONE_SERVICE_URL: http://zone-policy:3002
      DEVICE_SERVICE_URL: http://device-management:3003
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  sync-service:
    build:
      context: ..
      dockerfile: repo-sync-service/Dockerfile
    environment:
      <<: *common-env
      PORT: "3006"
      MQTT_BROKER_URL: mqtt://mosquitto:1883
      SCHEDULE_SERVICE_URL: http://schedule-service:3005
      ZONE_SERVICE_URL: http://zone-policy:3002
      DEVICE_SERVICE_URL: http://device-management:3003
      SIGNING_KMS_URL: http://signing-kms:3008
      DEDUP_WINDOW_SECONDS: "3600"
      MAX_OPS_PER_MINUTE: "60"
    depends_on:
      - redis
      - mosquitto

  validation-qa:
    build:
      context: ..
      dockerfile: repo-validation-qa/Dockerfile
    environment:
      <<: *common-env
      PORT: "3007"
      CONTENT_SERVICE_URL: http://content-service:3004

  signing-kms:
    build:
      context: ..
      dockerfile: repo-signing-kms/Dockerfile
    environment:
      <<: *common-env
      PORT: "3008"

  audit-service:
    build:
      context: ..
      dockerfile: repo-audit-service/Dockerfile
    environment:
      <<: *common-env
      PORT: "3009"
      DATABASE_URL: postgresql://campuscast:campuscast@postgres:5432/audit_db
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
