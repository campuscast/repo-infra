version: "3.9"

x-common-env: &common-env
  NODE_ENV: development
  REDIS_URL: redis://redis:6379
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317

services:
  # ─── Infrastructure ───
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: campuscast
      POSTGRES_PASSWORD: campuscast
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campuscast"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./docker/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
    ports:
      - "1883:1883"
      - "9883:9883"

  # ─── Reverse Proxy ───
  nginx:
    image: nginx:alpine
    volumes:
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api-gateway

  # ─── Observability ───
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3100:3000"

  loki:
    image: grafana/loki:latest
    ports:
      - "3200:3100"

  # ─── Application Services ───
  api-gateway:
    build: ../repo-api-gateway-bff
    environment:
      <<: *common-env
      PORT: "3000"
      AUTH_SERVICE_URL: http://auth-iam:3001
      ZONE_SERVICE_URL: http://zone-policy:3002
      DEVICE_SERVICE_URL: http://device-management:3003
      CONTENT_SERVICE_URL: http://content-service:3004
      SCHEDULE_SERVICE_URL: http://schedule-service:3005
      SYNC_SERVICE_URL: http://sync-service:3006
      VALIDATION_SERVICE_URL: http://validation-qa:3007
      AUDIT_SERVICE_URL: http://audit-service:3009
    ports:
      - "3000:3000"
    depends_on:
      - redis

  auth-iam:
    build: ../repo-auth-iam
    environment:
      <<: *common-env
      PORT: "3001"
      DATABASE_URL: postgresql://campuscast:campuscast@postgres:5432/auth_db
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  zone-policy:
    build: ../repo-zone-policy
    environment:
      <<: *common-env
      PORT: "3002"
      DATABASE_URL: postgresql://campuscast:campuscast@postgres:5432/zone_policy_db
    depends_on:
      postgres:
        condition: service_healthy

  device-management:
    build: ../repo-device-management
    environment:
      <<: *common-env
      PORT: "3003"
      DATABASE_URL: postgresql://campuscast:campuscast@postgres:5432/device_db
    depends_on:
      postgres:
        condition: service_healthy

  content-service:
    build: ../repo-content-service
    environment:
      <<: *common-env
      PORT: "3004"
      DATABASE_URL: postgresql://campuscast:campuscast@postgres:5432/content_db
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: campuscast-content
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  schedule-service:
    build: ../repo-schedule-service
    environment:
      <<: *common-env
      PORT: "3005"
      DATABASE_URL: postgresql://campuscast:campuscast@postgres:5432/schedule_db
      CRDT_COMPACTION_THRESHOLD: "100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  sync-service:
    build: ../repo-sync-service
    environment:
      <<: *common-env
      PORT: "3006"
      MQTT_BROKER_URL: mqtt://mosquitto:1883
      SCHEDULE_SERVICE_URL: http://schedule-service:3005
      DEDUP_WINDOW_SECONDS: "3600"
      MAX_OPS_PER_MINUTE: "60"
    ports:
      - "3006:3006"
    depends_on:
      - redis
      - mosquitto

  validation-qa:
    build: ../repo-validation-qa
    environment:
      <<: *common-env
      PORT: "3007"
      CONTENT_SERVICE_URL: http://content-service:3004
    profiles:
      - with-validation

  signing-kms:
    build: ../repo-signing-kms
    environment:
      <<: *common-env
      PORT: "3008"
    ports:
      - "3008:3008"

  audit-service:
    build: ../repo-audit-service
    environment:
      <<: *common-env
      PORT: "3009"
      DATABASE_URL: postgresql://campuscast:campuscast@postgres:5432/audit_db
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
